name: Checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run sdk:build
      - run: npm run build
      - run: python3 -B -m unittest discover -s integration/python -p test_client.py
